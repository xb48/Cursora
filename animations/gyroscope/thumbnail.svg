<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1f2733"/><stop offset="1" stop-color="#0b0e13"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9ced6"/><stop offset="1" stop-color="#5a626e"/></linearGradient>
    <radialGradient id="rotor" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffc08a"/><stop offset=".6" stop-color="#ff7a1a"/><stop offset="1" stop-color="#8c3a05"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <ellipse cx="164" cy="178" rx="52" ry="8" fill="#000" opacity=".35" filter="url(#blur)"/>
  <!-- back halves of the gimbal rings -->
  <path d="M160 164 A30 64 0 0 1 160 36" fill="none" stroke="#4a525e" stroke-width="5"/>
  <path d="M214 87 A56 17 0 0 0 106 113" fill="none" stroke="#4a525e" stroke-width="4.5"/>
  <!-- rotor and axle -->
  <ellipse cx="160" cy="100" rx="27" ry="10" fill="url(#rotor)" transform="rotate(-24 160 100)"/>
  <path d="M132 113 L188 87" stroke="#9aa3ae" stroke-width="2.6" stroke-linecap="round"/>
  <!-- front halves -->
  <path d="M160 36 A30 64 0 0 1 160 164" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <path d="M106 113 A56 17 0 0 0 214 87" fill="none" stroke="url(#metal)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="160" cy="100" r="40" fill="none" stroke="url(#metal)" stroke-width="3.5" stroke-opacity=".9"/>
  <g fill="#f4f6f9">
    <circle cx="160" cy="36" r="3.4"/><circle cx="160" cy="164" r="3.4"/>
    <circle cx="120" cy="100" r="3"/><circle cx="200" cy="100" r="3"/>
  </g>
  <circle cx="160" cy="100" r="5.5" fill="#36d1ff"/>
  <circle cx="160" cy="100" r="2.4" fill="#fff"/>
  <circle cx="160" cy="100" r="78" fill="none" stroke="#36d1ff" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
